# Configuración de Nginx Proxy para Dashboard
# IMPORTANTE: Este archivo debe actualizarse con el nombre del contenedor actual
# Ejecuta: ./update-proxy-config.sh para actualizarlo automáticamente

upstream dashboard_backend {
    # TODO: Reemplazar con el nombre del contenedor actual
    # Ejecuta ./update-proxy-config.sh para actualizar esto automáticamente
    server checkin24hs_dashboard.1.5hrc51yrnd41msmr2qloclfof:3000;
    
    # Resolver DNS dinámico
    resolver 127.0.0.11 valid=10s ipv6=off;
}

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://dashboard_backend;
        proxy_http_version 1.1;
        
        # Headers para el proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering off;
        proxy_request_buffering off;
        
        # No cachear respuestas
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
