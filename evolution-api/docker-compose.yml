version: '3.8'

services:
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution-api-checkin24hs
    restart: unless-stopped
    ports:
      - "8080:8080"  # Puerto de la API
    environment:
      # Configuración de la base de datos (usa SQLite por defecto, o PostgreSQL)
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "sqlite"  # Cambiar a "postgresql" si tienes PostgreSQL
      
      # Configuración de Redis (opcional pero recomendado)
      REDIS_ENABLED: "true"
      REDIS_URI: "redis://redis:6379"
      
      # Configuración de seguridad
      AUTHENTICATION_API_KEY: "${AUTHENTICATION_API_KEY:-checkin24hs-secret-key-2024}"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      
      # Configuración de servidor
      SERVER_URL: "${SERVER_URL:-http://localhost:8080}"
      SERVER_PORT: "8080"
      
      # Configuración de logs
      LOG_LEVEL: "ERROR"
      LOG_COLOR: "true"
      LOG_BAILEYS: "error"
      
      # Configuración de QR Code
      QRCODE_LIMIT: "30"
      QRCODE_COLOR: "198, 31, 31"
      
      # Configuración de webhook (para recibir mensajes)
      WEBHOOK_GLOBAL_URL: "${WEBHOOK_GLOBAL_URL:-http://localhost:3000/webhook/evolution}"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      
      # Configuración de Typebot (opcional)
      TYPEBOT_ENABLED: "false"
      
      # Configuración de Chatwoot (opcional)
      CHATWOOT_ENABLED: "false"
      
      # Configuración de S3 (opcional, para almacenar archivos)
      S3_ENABLED: "false"
      
      # Configuración de RabbitMQ (opcional)
      RABBITMQ_ENABLED: "false"
      
      # Configuración de websocket
      WEBSOCKET_GLOBAL_ENABLED: "true"
      WEBSOCKET_GLOBAL_EVENTS: "APPLICATION_STARTUP,QRCODE_UPDATED,MESSAGES_UPSERT,MESSAGES_UPDATE,MESSAGES_DELETE,SEND_MESSAGE,CONNECTION_UPDATE,CONTACTS_UPDATE,CONTACTS_UPSERT,PRESENCE_UPDATE,CHATS_UPDATE,CHATS_UPSERT,CHATS_DELETE,GROUPS_UPSERT,GROUP_UPDATE,GROUP_PARTICIPANTS_UPDATE,TYPEBOT_START,TYPEBOT_CHANGE_STATUS"
      
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
      - evolution_store:./instances
    networks:
      - evolution-network
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - evolution-network
    command: redis-server --appendonly yes

volumes:
  evolution_instances:
  evolution_store:
  redis_data:

networks:
  evolution-network:
    driver: bridge


