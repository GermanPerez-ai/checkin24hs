# WhatsApp Línea 2 (INSTANCE_NUMBER=2, puerto 3002).
# NO desplegar solo este archivo sobre el stack checkin24hs completo (borraría otros servicios).
# Usar: bash scripts/deploy_whatsapp2_servidor.sh

services:
  whatsapp2:
    image: easypanel/checkin24hs/whatsapp:latest
    environment:
      INSTANCE_NUMBER: "2"
      PORT: "3002"
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=easypanel"
        - "traefik.http.routers.whatsapp2.rule=Host(`whatsapp2.checkin24hs.com`)"
        - "traefik.http.routers.whatsapp2.entrypoints=websecure"
        - "traefik.http.routers.whatsapp2.service=whatsapp2"
        - "traefik.http.routers.whatsapp2.tls=true"
        - "traefik.http.routers.whatsapp2.tls.certresolver=letsencrypt"
        - "traefik.http.routers.whatsapp2.middlewares=whatsapp-cors,whatsapp-body"
        - "traefik.http.routers.whatsapp2.priority=100"
        - "traefik.http.services.whatsapp2.loadbalancer.server.port=3002"
    networks:
      - easypanel
    volumes:
      - whatsapp2-auth:/app/auth_info_baileys_2

networks:
  easypanel:
    external: true

volumes:
  whatsapp2-auth:
