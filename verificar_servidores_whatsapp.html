<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Servidores WhatsApp - Checkin24hs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #25D366;
            color: white;
        }
        
        .btn-primary:hover {
            background: #1ea952;
        }
        
        .btn-secondary {
            background: #667eea;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5568d3;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .status-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            background: #f8f9fa;
            transition: all 0.3s;
        }
        
        .status-card.checking {
            border-color: #ffc107;
            background: #fffbf0;
        }
        
        .status-card.success {
            border-color: #28a745;
            background: #f0f9f4;
        }
        
        .status-card.error {
            border-color: #dc3545;
            background: #fef5f5;
        }
        
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .status-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .badge-checking {
            background: #ffc107;
            color: #856404;
        }
        
        .badge-success {
            background: #28a745;
            color: white;
        }
        
        .badge-error {
            background: #dc3545;
            color: white;
        }
        
        .status-info {
            margin-top: 15px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            font-weight: 500;
            color: #666;
        }
        
        .info-value {
            color: #333;
            font-family: monospace;
            font-size: 14px;
        }
        
        .error-message {
            margin-top: 15px;
            padding: 12px;
            background: #fee;
            border-left: 4px solid #dc3545;
            border-radius: 4px;
            color: #721c24;
            font-size: 14px;
        }
        
        .json-preview {
            margin-top: 15px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            font-family: monospace;
            font-size: 12px;
            color: #333;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .summary {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            text-align: center;
        }
        
        .summary h2 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .summary-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Verificación de Servidores WhatsApp</h1>
        <p class="subtitle">Checkin24hs - Diagnóstico de API</p>
        
        <div class="controls">
            <button class="btn-primary" onclick="verificarTodos()">
                🔍 Verificar Todos los Servidores
            </button>
            <button class="btn-secondary" onclick="limpiarResultados()">
                🗑️ Limpiar Resultados
            </button>
        </div>
        
        <div class="status-grid" id="statusGrid">
            <!-- Las tarjetas se generarán dinámicamente -->
        </div>
        
        <div class="summary" id="summary" style="display: none;">
            <h2>📊 Resumen de Verificación</h2>
            <div class="summary-stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalServidores">0</div>
                    <div class="stat-label">Total Servidores</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="servidoresOnline">0</div>
                    <div class="stat-label">Online ✅</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="servidoresOffline">0</div>
                    <div class="stat-label">Offline ❌</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="tiempoPromedio">0ms</div>
                    <div class="stat-label">Tiempo Promedio</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const servidores = [
            { nombre: 'API 1', url: 'https://api1.checkin24hs.com', instancia: 1 },
            { nombre: 'API 2', url: 'https://api2.checkin24hs.com', instancia: 2 },
            { nombre: 'API 3', url: 'https://api3.checkin24hs.com', instancia: 3 },
            { nombre: 'API 4', url: 'https://api4.checkin24hs.com', instancia: 4 }
        ];
        
        function limpiarResultados() {
            document.getElementById('statusGrid').innerHTML = '';
            document.getElementById('summary').style.display = 'none';
        }
        
        async function verificarTodos() {
            limpiarResultados();
            const grid = document.getElementById('statusGrid');
            
            // Crear tarjetas iniciales
            servidores.forEach(servidor => {
                const card = crearTarjeta(servidor);
                grid.appendChild(card);
            });
            
            // Verificar cada servidor
            const resultados = await Promise.allSettled(
                servidores.map(servidor => verificarServidor(servidor))
            );
            
            // Calcular estadísticas
            calcularEstadisticas(resultados);
        }
        
        function crearTarjeta(servidor) {
            const card = document.createElement('div');
            card.className = 'status-card checking';
            card.id = `card-${servidor.instancia}`;
            card.innerHTML = `
                <div class="status-header">
                    <div class="status-title">${servidor.nombre}</div>
                    <div class="status-badge badge-checking">
                        <span class="loading"></span> Verificando...
                    </div>
                </div>
                <div class="status-info" id="info-${servidor.instancia}">
                    <div class="info-row">
                        <span class="info-label">URL:</span>
                        <span class="info-value">${servidor.url}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Estado:</span>
                        <span class="info-value">Verificando...</span>
                    </div>
                </div>
            `;
            return card;
        }
        
        async function verificarServidor(servidor) {
            const card = document.getElementById(`card-${servidor.instancia}`);
            const infoDiv = document.getElementById(`info-${servidor.instancia}`);
            const inicioTiempo = Date.now();
            
            const resultados = {
                servidor: servidor.nombre,
                url: servidor.url,
                instancia: servidor.instancia,
                inicioTiempo,
                endpoints: {}
            };
            
            try {
                // Verificar endpoint raíz
                await verificarEndpoint(servidor.url, '/', 'raiz', resultados);
                
                // Verificar /api/status
                await verificarEndpoint(servidor.url, `/api/status`, 'status', resultados);
                
                // Verificar /api/qr
                await verificarEndpoint(servidor.url, `/api/qr`, 'qr', resultados);
                
                // Verificar /api/health (si existe)
                await verificarEndpoint(servidor.url, `/api/health`, 'health', resultados);
                
                const tiempoTotal = Date.now() - inicioTiempo;
                resultados.tiempoTotal = tiempoTotal;
                
                // Actualizar UI con éxito
                card.className = 'status-card success';
                card.querySelector('.status-badge').innerHTML = '✅ Online';
                card.querySelector('.status-badge').className = 'status-badge badge-success';
                
                mostrarResultado(infoDiv, resultados, true);
                
                return resultados;
                
            } catch (error) {
                const tiempoTotal = Date.now() - inicioTiempo;
                resultados.tiempoTotal = tiempoTotal;
                resultados.error = error.message;
                
                // Actualizar UI con error
                card.className = 'status-card error';
                card.querySelector('.status-badge').innerHTML = '❌ Error';
                card.querySelector('.status-badge').className = 'status-badge badge-error';
                
                mostrarResultado(infoDiv, resultados, false);
                
                throw resultados;
            }
        }
        
        async function verificarEndpoint(baseUrl, endpoint, nombre, resultados) {
            const url = `${baseUrl}${endpoint}`;
            const inicio = Date.now();
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000); // 10 segundos timeout
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                    },
                    signal: controller.signal,
                    mode: 'cors', // Explicitamente permitir CORS
                    credentials: 'omit' // No enviar credenciales
                });
                
                clearTimeout(timeoutId);
                
                const tiempo = Date.now() - inicio;
                const contentType = response.headers.get('content-type') || '';
                const esJson = contentType.includes('application/json');
                
                let data = null;
                try {
                    if (esJson) {
                        data = await response.json();
                    } else {
                        data = await response.text();
                    }
                } catch (e) {
                    data = `Error parseando respuesta: ${e.message}`;
                }
                
                resultados.endpoints[nombre] = {
                    url,
                    status: response.status,
                    statusText: response.statusText,
                    tiempo,
                    ok: response.ok,
                    contentType,
                    data: esJson ? data : (typeof data === 'string' && data.length > 500 ? data.substring(0, 500) + '...' : data)
                };
                
            } catch (error) {
                const tiempo = Date.now() - inicio;
                let errorMessage = error.message;
                
                // Manejar errores de CORS específicamente
                if (error.message.includes('CORS') || error.message.includes('Failed to fetch') || error.name === 'TypeError') {
                    // Intentar con mode: 'no-cors' como fallback (solo para verificar conectividad)
                    try {
                        const response = await fetch(url, {
                            method: 'GET',
                            mode: 'no-cors',
                            cache: 'no-cache'
                        });
                        errorMessage = 'CORS bloqueado (servidor responde pero bloqueado por política del navegador)';
                    } catch (e) {
                        errorMessage = `Error de conexión o CORS: ${error.message}`;
                    }
                }
                
                resultados.endpoints[nombre] = {
                    url,
                    error: errorMessage,
                    tiempo,
                    ok: false
                };
            }
        }
        
        function mostrarResultado(infoDiv, resultados, exito) {
            let html = `
                <div class="info-row">
                    <span class="info-label">URL:</span>
                    <span class="info-value">${resultados.url}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Estado General:</span>
                    <span class="info-value">${exito ? '✅ Online' : '❌ Error'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Tiempo Total:</span>
                    <span class="info-value">${resultados.tiempoTotal}ms</span>
                </div>
            `;
            
            // Mostrar resultados de cada endpoint
            Object.keys(resultados.endpoints).forEach(nombre => {
                const endpoint = resultados.endpoints[nombre];
                const estado = endpoint.ok ? '✅' : '❌';
                const tiempo = endpoint.tiempo || 0;
                
                html += `
                    <div class="info-row">
                        <span class="info-label">${nombre.toUpperCase()}:</span>
                        <span class="info-value">${estado} ${endpoint.status || 'N/A'} (${tiempo}ms)</span>
                    </div>
                `;
                
                // Mostrar detalles del endpoint si hay datos
                if (endpoint.data && endpoint.ok) {
                    const dataStr = typeof endpoint.data === 'object' 
                        ? JSON.stringify(endpoint.data, null, 2) 
                        : endpoint.data.toString();
                    
                    html += `
                        <div class="json-preview" style="margin-top: 10px;">
                            <strong>${nombre.toUpperCase()} Response:</strong><br>
                            ${dataStr.substring(0, 500)}${dataStr.length > 500 ? '...' : ''}
                        </div>
                    `;
                }
                
                if (endpoint.error) {
                    html += `
                        <div class="error-message" style="margin-top: 10px;">
                            <strong>Error en ${nombre}:</strong> ${endpoint.error}
                        </div>
                    `;
                }
            });
            
            if (resultados.error) {
                html += `
                    <div class="error-message">
                        <strong>Error General:</strong> ${resultados.error}
                    </div>
                `;
            }
            
            infoDiv.innerHTML = html;
        }
        
        function calcularEstadisticas(resultados) {
            const total = resultados.length;
            const exitosos = resultados.filter(r => r.status === 'fulfilled').length;
            const fallidos = total - exitosos;
            
            const tiemposExitosos = resultados
                .filter(r => r.status === 'fulfilled')
                .map(r => r.value?.tiempoTotal || 0);
            
            const tiempoPromedio = tiemposExitosos.length > 0
                ? Math.round(tiemposExitosos.reduce((a, b) => a + b, 0) / tiemposExitosos.length)
                : 0;
            
            document.getElementById('totalServidores').textContent = total;
            document.getElementById('servidoresOnline').textContent = exitosos;
            document.getElementById('servidoresOffline').textContent = fallidos;
            document.getElementById('tiempoPromedio').textContent = tiempoPromedio + 'ms';
            document.getElementById('summary').style.display = 'block';
        }
        
        // Verificar automáticamente al cargar
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => verificarTodos(), 500);
        });
    </script>
</body>
</html>
